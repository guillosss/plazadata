# Blueprint de Render: crea el servicio web y la base PostgreSQL gratuitos.
databases:
  - name: plazadata-db
    plan: free
    databaseName: plazadata

services:
  - type: web
    name: plazadata
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENTORNO
        value: produccion
      - key: PROXY_HOPS
        value: "1"   # verificar en los registros (ver README, sección Seguridad)
      - key: DATABASE_URL
        fromDatabase:
          name: plazadata-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true   # Render genera una clave; verla en Environment y usarla en /admin
