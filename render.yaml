# Blueprint de Render: crea el servicio web y la base PostgreSQL gratuitos.
databases:
  - name: plazadata-db
    plan: free
    databaseName: plazadata

services:
  - type: web
    name: plazadata
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: plazadata-db
          property: connectionString
